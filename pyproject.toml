[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image_description"
version = "0.0.0"
description = "Image description, social publishing, and Marie-Parie media workflow tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "galet>=0.1.28",
    "openai>=3.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ngrok = ["pyngrok>=7,<10"]
gemini = ["google-genai>=2.33.0"]

[project.scripts]
image = "image_description.cli.image_cli:main"
post-builder = "image_description.cli.post_builder_cli:main"
blog-post-builder = "image_description.cli.blog_post_builder_cli:main"
gallery-builder = "image_description.cli.gallery_builder_cli:main"
scan-notes = "image_description.cli.scan_notes_cli:main"
facebook = "image_description.cli.facebook_cli:main"
instagram = "image_description.cli.instagram_cli:main"
instagram-reel = "image_description.cli.instagram_reels_cli:main"
marie-prepare = "image_description.cli.marie_prepare_cli:main"
marie-resize = "image_description.cli.marie_resize_cli:main"
marie-inspect = "image_description.cli.marie_inspect_cli:main"
marie-describe = "image_description.cli.marie_describe_cli:main"
marie-rename = "image_description.cli.marie_rename_cli:main"
marie-publish = "image_description.cli.marie_publish_cli:main"
marie-video = "image_description.cli.marie_video_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
